# ---------------------------------------------------------------------------
# 2026 FIFA World Cup simulation config
# ---------------------------------------------------------------------------
# The simulator AUTO-DERIVES the live tournament state (group results, who has
# been eliminated, who is still alive, which round is next) directly from the
# results dataset. This file only lets you override a few things.

# Teams that get home advantage when a match is played in their own country.
host_nations: [United States, Canada, Mexico]

# OPTIONAL explicit knockout bracket for the *current* round. List every
# surviving team in bracket order — adjacent pairs meet (slot 0 vs 1, 2 vs 3, …),
# and each pair's winner meets the next pair's winner, up to the final.
# Leave empty ([]) to auto-seed the alive teams by Elo into a standard bracket.
#
# Example (Round of 16):
# knockout_order:
#   - Spain
#   - Morocco
#   - ...   (16 teams total)
knockout_order: []

# Number of Monte-Carlo tournament simulations.
simulations: 20000

# Random seed for reproducibility.
seed: 20260704
